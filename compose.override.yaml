x-ghcr-api: &ghcr-api
  image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/the-way-api:${APP_VERSION:?Set APP_VERSION to a published SHA tag}
  build: !reset null

services:
  api:
    <<: *ghcr-api

  api2:
    <<: *ghcr-api

  worker:
    <<: *ghcr-api

  indexes:
    <<: *ghcr-api

  uploads-init:
    <<: *ghcr-api

  web:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/the-way-web:${APP_VERSION:?Set APP_VERSION to a published SHA tag}
    build: !reset null
    environment:
      SITE_ADDRESS: ":80"
      API_UPSTREAMS: "api:4000 api2:4000"
    ports: !reset []

  web2:
    extends:
      file: compose.build.yaml
      service: web

    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/the-way-web:${APP_VERSION:?Set APP_VERSION to a published SHA tag}
    build: !reset null

    environment:
      SITE_ADDRESS: ":80"
      API_UPSTREAMS: "api:4000 api2:4000"

    ports: !reset []

    volumes:
      - uploads_data:/srv/uploads:ro
      - frontend_assets:/srv/assets

    networks:
      - private

    depends_on:
      uploads-init:
        condition: service_completed_successfully

    restart: unless-stopped

    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
