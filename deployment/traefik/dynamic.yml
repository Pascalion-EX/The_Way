# The file provider expands DOMAIN from Traefik's environment at startup.
# Requests go directly to the API containers, keeping TRUST_PROXY=1 accurate.
http:
  routers:
    camp-payment-application:
      rule: 'Host(`{{ env "DOMAIN" }}`) && Method(`POST`) && PathRegexp(`^/api/camps/[a-fA-F0-9]{24}/apply$`)'
      priority: 200
      entryPoints: [websecure]
      service: api
      middlewares: [security-headers, camp-payment-body-limit]
      tls:
        certResolver: le
    lesson-import:
      rule: 'Host(`{{ env "DOMAIN" }}`) && Method(`POST`) && Path(`/api/lessons/import`)'
      priority: 200
      entryPoints: [websecure]
      service: api
      middlewares: [security-headers, lesson-document-body-limit]
      tls:
        certResolver: le
    image-upload:
      rule: 'Host(`{{ env "DOMAIN" }}`) && Path(`/api/uploads/images`)'
      priority: 200
      entryPoints: [websecure]
      service: api
      middlewares: [security-headers, image-body-limit]
      tls:
        certResolver: le
    api:
      rule: 'Host(`{{ env "DOMAIN" }}`) && (Path(`/api`) || PathPrefix(`/api/`) || Path(`/health/live`) || Path(`/health/ready`))'
      priority: 100
      entryPoints: [websecure]
      service: api
      middlewares: [security-headers, api-body-limit]
      tls:
        certResolver: le
    frontend:
      rule: 'Host(`{{ env "DOMAIN" }}`)'
      priority: 1
      entryPoints: [websecure]
      service: frontend
      middlewares: [security-headers]
      tls:
        certResolver: le

  services:
    api:
      loadBalancer:
        # Equal weights use the default round-robin strategy; no sticky sessions.
        servers:
          - url: http://api:4000
          - url: http://api2:4000
        healthCheck:
          path: /health/ready
          interval: 15s
          timeout: 3s
          followRedirects: false
          status: 200
    frontend:
      loadBalancer:
        servers:
          - url: http://web:80
          - url: http://web2:80
        healthCheck:
          path: /health/frontend
          interval: 15s
          timeout: 3s
          status: 200

  middlewares:
    camp-payment-body-limit:
      buffering:
        # 5 MiB screenshot plus 128 KiB for application fields and multipart data.
        maxRequestBodyBytes: 5373952
        memRequestBodyBytes: 5373952
    lesson-document-body-limit:
      buffering:
        # 10 MiB file plus 64 KiB for multipart boundaries and headers.
        # Keep this in memory because the Traefik container is read-only.
        maxRequestBodyBytes: 10551296
        memRequestBodyBytes: 10551296
    image-body-limit:
      buffering:
        maxRequestBodyBytes: 5242880
        memRequestBodyBytes: 5242880
    api-body-limit:
      buffering:
        maxRequestBodyBytes: 100000
        memRequestBodyBytes: 100000
    security-headers:
      headers:
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          Server: ""
