name: the-way

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  NODE_ENV: production
  PORT: "4000"
  APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
  TRUST_PROXY: "1"
  MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env}
  SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
  SENDER_EMAIL: ${SENDER_EMAIL:?Set SENDER_EMAIL}
  VIDEO_REQUEST_EMAIL: ${VIDEO_REQUEST_EMAIL:?Set VIDEO_REQUEST_EMAIL}
  EMAIL_WORKER_ENABLED: "false"
  MONGO_POOL_SIZE: "20"
  REQUEST_LOGS: "true"
  QUERY_TIMING_LOGS: "true"
  SLOW_QUERY_MS: "100"
  UPLOADS_DIR: /app/uploads

x-api: &api
  extends:
    file: compose.build.yaml
    service: api
  environment:
    <<: *app-env
    NODE_OPTIONS: --max-old-space-size=640
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 1g
  cpus: 1.0
  pids_limit: 128
  stop_grace_period: 45s
  logging: *logging
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health/ready', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  networks: [private]

services:
  db:
    image: mongo:8.0
    command: [mongod, --bind_ip_all, --wiredTigerCacheSizeGB, "1.25", --quiet]
    environment:
      MONGO_INITDB_ROOT_USERNAME: kerolosafam_db_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: the_way
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      - ./deployment/mongo-init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    networks: [private]
    restart: unless-stopped
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 256
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "const app=db.getSiblingDB('the_way'); app.auth('kerolosafam_db_user',process.env.MONGO_APP_PASSWORD); quit(app.runCommand({ping:1}).ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    <<: *api
    volumes:
      - uploads_data:/app/uploads
    depends_on: &app-dependencies
      db:
        condition: service_healthy
      indexes:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully

  api2:
    <<: *api
    volumes:
      - uploads_data:/app/uploads
    depends_on: *app-dependencies

  uploads-init:
    <<: *api
    user: "0:0"
    command: [node, -e, "const fs=require('node:fs'); fs.mkdirSync('/app/uploads',{recursive:true}); fs.chmodSync('/app/uploads',0o755); fs.chownSync('/app/uploads',1000,1000)"]
    environment:
      NODE_OPTIONS: --max-old-space-size=64
    volumes:
      - uploads_data:/app/uploads
    depends_on: []
    restart: "no"
    cap_add: [CHOWN, FOWNER]
    healthcheck:
      disable: true
    mem_limit: 128m
    cpus: 0.1

  worker:
    <<: *api
    depends_on: *app-dependencies
    command: [node, worker.js]
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=128
      MONGO_POOL_SIZE: "5"
      REQUEST_LOGS: "false"
    healthcheck:
      disable: true
    mem_limit: 256m
    cpus: 0.25

  traefik:
    image: traefik:v3.7.16
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=true
      - --entrypoints.traefik.address=127.0.0.1:8080
      - --ping=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --serverstransport.forwardingtimeouts.dialtimeout=3s
      - --serverstransport.forwardingtimeouts.responseheadertimeout=45s
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/traefik:/etc/traefik/dynamic:ro
      - traefik_data:/letsencrypt
    networks: [private]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      api2:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 30s
    logging: *logging
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    extends:
      file: compose.build.yaml
      service: web
    volumes:
      - uploads_data:/srv/uploads:ro
    depends_on:
      uploads-init:
        condition: service_completed_successfully
    networks: [private]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    logging: *logging

  indexes:
    <<: *api
    command: [node, scripts/createIndexes.js]
    restart: "no"
    healthcheck:
      disable: true

  backup:
    image: mongo:8.0
    profiles: [tools]
    entrypoint: [sh, /scripts/backup-container.sh]
    environment:
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - ./deployment/mongo-tools-config.js:/scripts/mongo-tools-config.js:ro
      - ./deployment/backup-container.sh:/scripts/backup-container.sh:ro
      - ./deployment/restore-container.sh:/scripts/restore-container.sh:ro
      - ./deployment/backups:/backups
      - uploads_data:/uploads
    networks: [private]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

networks:
  # No host ports on MongoDB or Node. Outbound DNS/SMTP is still allowed.
  private:

volumes:
  mongo_data:
  traefik_data:
  uploads_data:
